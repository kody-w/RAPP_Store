services:
  open-seo:
    image: ${RAPP_DOCK_IMAGE_OPEN_SEO:?Materialize locked public images first}
    platform: linux/arm64
    pull_policy: never
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2g
    cpus: 1.5
    pids_limit: 256
    environment:
      HOME: /runtime
      TMPDIR: /runtime
      XDG_CACHE_HOME: /runtime/cache
      AUTH_MODE: local_noauth
      PORT: "3001"
      ALLOWED_HOST: localhost
      OPENSEO_TELEMETRY_DISABLED: "1"
      WRANGLER_SEND_METRICS: "false"
      DO_NOT_TRACK: "1"
      COREPACK_ENABLE_NETWORK: "0"
      CLOUDFLARE_INCLUDE_PROCESS_ENV: "true"
      CI: "true"
    tmpfs:
      - /runtime:rw,nosuid,nodev,size=268435456,uid=10001,gid=10001,mode=0700
      - /app/node_modules/.vite-temp:rw,nosuid,nodev,size=67108864,uid=10001,gid=10001,mode=0700
    volumes:
      - database:/app/.wrangler
    networks: [sandbox]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
    labels:
      rapp.dock.namespace: "${RAPP_DOCK_NAMESPACE}"
  ingress:
    image: ${RAPP_DOCK_IMAGE_OPEN_SEO:?Materialize locked public images first}
    platform: linux/arm64
    pull_policy: never
    user: "10001:10001"
    entrypoint: ["node", "/rapp/ingress.mjs"]
    command: []
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    env_file:
      - path: "${RAPP_DOCK_SECRETS}/open-seo.env"
    environment:
      RAPP_DOCK_PORT: "${RAPP_DOCK_PORT}"
      HOME: /runtime
      TMPDIR: /runtime
    volumes:
      - ./ingress.mjs:/rapp/ingress.mjs:ro
    ports: ["127.0.0.1:${RAPP_DOCK_PORT}:3001"]
    networks: [sandbox, ingress]
    depends_on: [open-seo]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('node:http').get('http://127.0.0.1:3001/api/health',{headers:{Host:'127.0.0.1:'+process.env.RAPP_DOCK_PORT}},r=>{r.resume();process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: "2m", max-file: "2"}
    labels:
      rapp.dock.namespace: "${RAPP_DOCK_NAMESPACE}"
volumes:
  database:
    labels:
      rapp.dock.namespace: "${RAPP_DOCK_NAMESPACE}"
networks:
  sandbox:
    internal: true
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
    labels:
      rapp.dock.namespace: "${RAPP_DOCK_NAMESPACE}"
  ingress:
    labels:
      rapp.dock.namespace: "${RAPP_DOCK_NAMESPACE}"
