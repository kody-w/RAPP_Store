<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Toaster</title>
<style>
:root{--bg:#faf9f7;--fg:#1b1917;--dim:#6b625a;--line:#e5dfd7;--accent:#c2410c;--card:#fff;--code:#f3f0ec;--bad:#b91c1c;--ok:#15803d}
@media(prefers-color-scheme:dark){:root{--bg:#151311;--fg:#ece7e1;--dim:#9c9289;--line:#2b2724;--accent:#fb923c;--card:#1c1917;--code:#201d1a;--bad:#f87171;--ok:#4ade80}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 ui-sans-serif,system-ui,sans-serif}
.wrap{max-width:48rem;margin:0 auto;padding:2.5rem 1.25rem 4rem}h1{font-size:1.9rem;margin:0 0 .35rem;letter-spacing:-.02em}
.lede{color:var(--dim);margin:0 0 2rem}.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:1.1rem;margin-bottom:1rem}
label{display:block;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);margin-bottom:.3rem}
input,select{width:100%;padding:.55rem .7rem;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--fg);font:14px ui-monospace,monospace;margin-bottom:.9rem}
button{background:var(--accent);color:#fff;border:0;padding:.6rem 1.1rem;border-radius:7px;font-weight:600;cursor:pointer}
pre{background:var(--code);border:1px solid var(--line);border-radius:8px;padding:.9rem;overflow-x:auto;font-size:.82rem}
table{width:100%;border-collapse:collapse;font-size:.86rem}th,td{text-align:left;padding:.42rem .5rem;border-bottom:1px solid var(--line)}
th{font-size:.72rem;text-transform:uppercase;color:var(--dim)}code{background:var(--code);padding:.1em .35em;border-radius:4px}
.note{color:var(--dim);font-size:.85rem}.big{font-size:1.5rem;font-weight:700}.pill{display:inline-block;background:var(--code);border-radius:999px;padding:.1rem .6rem;margin:.15rem .3rem .15rem 0;font-size:.8rem}
</style></head><body><div class="wrap">
<h1>Toaster</h1><p class="lede">A raw <code>SKILL.md</code> is bread: prose with no canonical form, so nothing
can be measured against it. Toasting derives the deterministic layer the prose actually evidences and anchors it —
after that, drift is detectable.</p>
<div class="card">
<label>Action</label><select id="action">
<option value="inspect">inspect — what survives, layer by layer</option>
<option value="toast">toast — derive + anchor (idempotent)</option>
<option value="convert">convert — project to another format</option>
<option value="soak">soak — prove it does not drift</option></select>
<label>Capability file</label><input id="path" placeholder="my-skill/SKILL.md" spellcheck="false">
<label>Target format (convert only)</label><select id="to">
<option value="">—</option><option value="agent">agent.py</option><option value="skill">SKILL.md</option>
<option value="openclaw">openclaw</option><option value="openrappter">openrappter</option><option value="rci">rci</option></select>
<button id="go">Run</button></div><div id="out"></div>
<script>
const $=s=>document.querySelector(s);
$('#go').onclick=async()=>{const b=$('#go');b.disabled=true;b.textContent='Working…';
 const a=$('#action').value;let call=`action=${a} path="${$('#path').value}"`;
 if(a==='convert'&&$('#to').value)call+=` to=${$('#to').value}`;
 try{const r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},
  body:JSON.stringify({user_input:`Use the Toaster tool with ${call}. Reply only DONE.`})});
  const d=await r.json();const m=String(d.agent_logs||'').match(/\{[\s\S]*\}/);
  $('#out').innerHTML=m?render(JSON.parse(m[0]),a):`<div class="card"><pre>${esc(d.response||'no result')}</pre></div>`;
 }catch(e){$('#out').innerHTML=`<div class="card">Could not reach the brainstem.<pre>${esc(e.message)}</pre></div>`;}
 finally{b.disabled=false;b.textContent='Run';}};
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function render(d,a){if(d.status==='error')return`<div class="card" style="color:var(--bad)">${esc(d.message)}</div>`;
 if(d.status==='refused')return`<div class="card"><strong style="color:var(--bad)">REFUSED</strong>
  <div>${esc(d.reason)}</div><p class="note">${esc(d.fix||'')}</p></div>`;
 if(a==='inspect'){let h=`<div class="card"><div class="big">${esc(d.name||'')}</div>
  <div class="note">${esc(d.description||'')}</div><div style="margin-top:.7rem">`;
  h+=`<span class="pill">${d.is_raw_bread?'RAW BREAD':'TOAST'}</span>`;
  h+=`<span class="pill">${(d.typed_parameters||[]).length} typed param(s)</span>`;
  h+=`<span class="pill">${d.derived_steps} step(s)</span>`;
  h+=`<span class="pill">${d.has_code?'has code':'no code'}</span></div>`;
  if((d.typed_parameters||[]).length)h+=`<pre>${esc(d.typed_parameters.join(', '))}</pre>`;
  return h+`<p class="note">capability id <code>${esc(d.capability_id||'')}</code></p></div>`;}
 if(a==='toast'){if(d.already_toast)return`<div class="card">Already toast — toasting is idempotent.
  <p class="note">capability id <code>${esc(d.capability_id)}</code></p></div>`;
  let h=`<div class="card"><div class="big">${d.typed_parameters.before} → ${d.typed_parameters.after}</div>
  typed parameter(s) · ${d.steps_derived} step(s) derived`;
  if((d.derivation||[]).length){h+=`<table><tr><th>param</th><th>from</th><th>line</th></tr>`;
   for(const x of d.derivation)h+=`<tr><td><code>${esc(x.param)}</code></td><td>${esc(x.token)}</td><td>${x.line}</td></tr>`;h+=`</table>`;}
  return h+`<p class="note">${esc(d.note||'')}</p></div>`;}
 if(a==='soak'){const ok=d.capability_preserved;
  return`<div class="card"><span class="big" style="color:${ok?'var(--ok)':'var(--bad)'}">${ok?'NO DRIFT':'DRIFT'}</span>
  <div>capability preserved across ${d.routes_checked} route(s)</div>
  ${(d.failed_routes||[]).length?`<pre>${esc(d.failed_routes.join('\n'))}</pre>`:''}
  <p class="note">${esc(d.note||'')}</p></div>`;}
 return`<div class="card"><pre>${esc(JSON.stringify(d,null,2))}</pre></div>`;}
</script></div></body></html>
