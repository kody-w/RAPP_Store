name: Zoo v2 invalidate stale PRs after main advances

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: zoo-v2-main-advance
  cancel-in-progress: true

jobs:
  revalidate-open-candidates:
    environment: zoo-v2-validator
    runs-on: ubuntu-latest
    steps:
      - name: Mint dedicated validator App token
        id: validator-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.ZOO_V2_VALIDATOR_APP_ID }}
          private-key: ${{ secrets.ZOO_V2_VALIDATOR_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Revalidate each open Zoo v2 PR with trusted main tooling
        env:
          BASE_SHA: ${{ github.sha }}
          RETIRE_TOKEN: ${{ github.token }}
          VALIDATOR_TOKEN: ${{ steps.validator-token.outputs.token }}
        run: |
          set -euo pipefail
          test -n "$VALIDATOR_TOKEN"
          test -n "$RETIRE_TOKEN"
          tools="$GITHUB_WORKSPACE/scripts/zoo_v2_release.py"
          export GH_TOKEN="$RETIRE_TOKEN"
          git fetch --prune --tags origin main
          latest_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" \
            --jq .object.sha)"
          test "$latest_main" = "$BASE_SHA" || exit 0
          python3 "$tools" list-prs \
            --root "$GITHUB_WORKSPACE" \
            --repository "$GITHUB_REPOSITORY" \
            --state open |
            jq -r '.[] | [.number, .headRefName, .headRefOid,
                          .headRepository] | @tsv' |
          while IFS=$'\t' read -r number branch sha head_repo; do
            test -n "$sha" || continue
            state=failure
            if test "$head_repo" = "$GITHUB_REPOSITORY"; then
              git fetch --no-tags origin "$sha"
              check_dir=".zoo-v2-check-${sha}"
              git worktree add --detach "$check_dir" "$sha"
              if mode="$(python3 "$tools" gate-pr \
                  --root "$check_dir" \
                  --base-sha "$BASE_SHA" \
                  --head-sha "$sha" \
                  --head-ref "$branch" \
                  --head-repository "$head_repo" \
                  --repository "$GITHUB_REPOSITORY")" &&
                test "$mode" = issue &&
                python3 "$tools" validate-pr \
                  --root "$check_dir" \
                  --repository "$GITHUB_REPOSITORY"; then
                  state=success
              fi
              git worktree remove --force "$check_dir"
            fi
            latest_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" \
              --jq .object.sha)"
            test "$latest_main" = "$BASE_SHA" || exit 0
            current_head="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${number}" \
              --jq .head.sha)"
            test "$current_head" = "$sha" || continue
            GH_TOKEN="$VALIDATOR_TOKEN" gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/statuses/${sha}" \
              -f state="$state" \
              -f context='Zoo v2 current-main' \
              -f description="Defense check against main ${BASE_SHA:0:12}"
            if test "$state" = failure &&
              [[ "$branch" =~ ^zoo-v2/issue-[1-9][0-9]*-[0-9a-f]{64}$ ]] &&
              test "$head_repo" = "$GITHUB_REPOSITORY"; then
              GH_TOKEN="$RETIRE_TOKEN" python3 "$tools" supersede-pr \
                --root "$GITHUB_WORKSPACE" \
                --repository "$GITHUB_REPOSITORY" \
                --pr-number "$number" \
                --base-sha "$BASE_SHA" \
                --head-sha "$sha" ||
                echo "PR #${number} was not an exact stale retry candidate; left open."
            fi
          done
