name: Zoo v2 current-main validation
run-name: "Zoo v2 PR #${{ github.event.pull_request.number || inputs.pr_number }} @ ${{ github.event.pull_request.head.sha || inputs.expected_head }}"

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Same-repository PR to validate (also used for token-created PRs)
        required: true
        type: string
      expected_head:
        description: Exact candidate commit; refuse a changed head
        required: true
        type: string

permissions: {}

concurrency:
  group: zoo-v2-current-main-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  current-main:
    permissions:
      contents: read
      pull-requests: read
    environment: zoo-v2-validator
    runs-on: ubuntu-latest
    steps:
      - name: Check validator App availability before minting
        id: app-settings
        env:
          ZOO_V2_VALIDATOR_APP_ID: ${{ secrets.ZOO_V2_VALIDATOR_APP_ID }}
          ZOO_V2_VALIDATOR_PRIVATE_KEY: ${{ secrets.ZOO_V2_VALIDATOR_PRIVATE_KEY }}
          ZOO_V2_VALIDATOR_APP_LOGIN: ${{ secrets.ZOO_V2_VALIDATOR_APP_LOGIN }}
          ZOO_V2_VALIDATOR_APP_SLUG: ${{ secrets.ZOO_V2_VALIDATOR_APP_SLUG }}
          ZOO_V2_VALIDATOR_APP_USER_ID: ${{ secrets.ZOO_V2_VALIDATOR_APP_USER_ID }}
        run: |
          python3 - <<'PY'
          import os
          import sys
          from pathlib import Path
          names = ("APP_ID", "PRIVATE_KEY", "APP_LOGIN", "APP_SLUG", "APP_USER_ID")
          missing = ["ZOO_V2_VALIDATOR_" + name for name in names
                     if not os.environ.get("ZOO_V2_VALIDATOR_" + name, "").strip()]
          if missing:
              message = "validator App unavailable: missing " + ", ".join(missing)
              print("::error::" + message)
              with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as out:
                  out.write("## validator App unavailable\n\n" + message + "\n\n"
                            "No App token was minted. No successful Zoo v2 current-main "
                            "status was issued. An administrator must provision the validator.\n")
              sys.exit(1)
          PY

      - name: Check out trusted current main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          path: trusted-main
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Require exact validator App configuration
        id: app-config
        env:
          VALIDATOR_APP_ID: ${{ secrets.ZOO_V2_VALIDATOR_APP_ID }}
          VALIDATOR_APP_LOGIN: ${{ secrets.ZOO_V2_VALIDATOR_APP_LOGIN }}
          VALIDATOR_APP_SLUG: ${{ secrets.ZOO_V2_VALIDATOR_APP_SLUG }}
          VALIDATOR_APP_USER_ID: ${{ secrets.ZOO_V2_VALIDATOR_APP_USER_ID }}
        run: |
          set -euo pipefail
          test -n "$VALIDATOR_APP_ID"
          test -n "$VALIDATOR_APP_SLUG"
          test -n "$VALIDATOR_APP_LOGIN"
          test -n "$VALIDATOR_APP_USER_ID"
          python3 "$GITHUB_WORKSPACE/trusted-main/scripts/configure_zoo_v2_protection.py" \
            verify-audit \
            --repository "$GITHUB_REPOSITORY" \
            --validator-app-id "$VALIDATOR_APP_ID" \
            --validator-app-slug "$VALIDATOR_APP_SLUG" \
            --validator-app-login "$VALIDATOR_APP_LOGIN" \
            --validator-app-user-id "$VALIDATOR_APP_USER_ID"

      - name: Resolve exact current PR subject
        id: subject
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          INPUT_PR: ${{ inputs.pr_number }}
          INPUT_HEAD: ${{ inputs.expected_head }}
        with:
          script: |
            const dispatched = context.eventName === 'workflow_dispatch';
            if (dispatched && context.ref !== 'refs/heads/main') {
              throw new Error('Validator dispatch must run from trusted main');
            }
            const raw = dispatched ? process.env.INPUT_PR : String(context.payload.pull_request.number);
            if (!/^[1-9][0-9]*$/.test(raw)) throw new Error('Invalid PR number');
            const expected = dispatched ? process.env.INPUT_HEAD : context.payload.pull_request.head.sha;
            if (!/^[0-9a-f]{40}$/.test(expected)) throw new Error('Invalid expected head');
            const {data: pr} = await github.rest.pulls.get({...context.repo, pull_number: Number(raw)});
            if (pr.state !== 'open' || pr.base.ref !== 'main' || pr.head.sha !== expected) {
              throw new Error('Stale or ineligible PR; revalidate its exact current head');
            }
            core.setOutput('number', raw);
            core.setOutput('sha', pr.head.sha);
            core.setOutput('ref', pr.head.ref);
            core.setOutput('repository', pr.head.repo.full_name);

      - name: Mint dedicated validator App token
        id: validator-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.ZOO_V2_VALIDATOR_APP_ID }}
          private-key: ${{ secrets.ZOO_V2_VALIDATOR_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read
          permission-pull-requests: read
          permission-statuses: write

      - name: Check out candidate as inert data
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ steps.subject.outputs.repository }}
          ref: ${{ steps.subject.outputs.sha }}
          fetch-depth: 0
          path: candidate
          persist-credentials: false

      - name: Inspect complete local diff with trusted main
        id: inspection
        continue-on-error: true
        env:
          CANDIDATE_ROOT: ${{ github.workspace }}/candidate
          HEAD_REF: ${{ steps.subject.outputs.ref }}
          HEAD_REPOSITORY: ${{ steps.subject.outputs.repository }}
          HEAD_SHA: ${{ steps.subject.outputs.sha }}
          TRUSTED_ROOT: ${{ github.workspace }}/trusted-main
        run: |
          set -euo pipefail
          git -C "$TRUSTED_ROOT" fetch --no-tags --force origin main
          base_sha="$(git -C "$TRUSTED_ROOT" rev-parse origin/main)"
          test "$(git -C "$TRUSTED_ROOT" rev-parse HEAD)" = "$base_sha"
          test "$(git -C "$CANDIDATE_ROOT" rev-parse HEAD)" = "$HEAD_SHA"
          git -C "$CANDIDATE_ROOT" remote add trusted-base \
            "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$CANDIDATE_ROOT" fetch --no-tags --force trusted-base \
            "refs/heads/main:refs/remotes/trusted-base/main"
          test "$(git -C "$CANDIDATE_ROOT" rev-parse trusted-base/main)" = "$base_sha"

          set +e
          mode="$(
            PYTHONNOUSERSITE=1 \
            PYTHONPATH="$TRUSTED_ROOT/scripts" \
            python3 "$TRUSTED_ROOT/scripts/zoo_v2_release.py" gate-pr \
              --root "$CANDIDATE_ROOT" \
              --base-sha "$base_sha" \
              --head-sha "$HEAD_SHA" \
              --head-ref "$HEAD_REF" \
              --head-repository "$HEAD_REPOSITORY" \
              --repository "$GITHUB_REPOSITORY"
          )"
          result=$?
          set -e
          test "$result" -eq 0 || mode=unauthorized
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          exit "$result"

      - name: Run trusted-main validation for classified diff
        id: validation
        if: steps.inspection.outcome == 'success'
        continue-on-error: true
        env:
          BASE_SHA: ${{ steps.inspection.outputs.base_sha }}
          CANDIDATE_ROOT: ${{ github.workspace }}/candidate
          HEAD_SHA: ${{ steps.subject.outputs.sha }}
          MODE: ${{ steps.inspection.outputs.mode }}
          TRUSTED_ROOT: ${{ github.workspace }}/trusted-main
        run: |
          set -euo pipefail
          test "$(git -C "$TRUSTED_ROOT" rev-parse HEAD)" = "$BASE_SHA"
          test "$(git -C "$CANDIDATE_ROOT" rev-parse HEAD)" = "$HEAD_SHA"
          case "$MODE" in
            none)
              echo "No protected Store paths changed."
              ;;
            issue)
              PYTHONNOUSERSITE=1 \
              PYTHONPATH="$TRUSTED_ROOT/scripts" \
              python3 "$TRUSTED_ROOT/scripts/zoo_v2_release.py" validate-pr \
                --root "$CANDIDATE_ROOT" \
                --repository "$GITHUB_REPOSITORY" \
                --remote trusted-base
              ;;
            bootstrap)
              PYTHONNOUSERSITE=1 \
              PYTHONPATH="$TRUSTED_ROOT/scripts" \
              python3 "$TRUSTED_ROOT/scripts/zoo_v2_release.py" \
                validate-bootstrap-pr \
                --root "$CANDIDATE_ROOT" \
                --base-sha "$BASE_SHA" \
                --head-sha "$HEAD_SHA" \
                --repository "$GITHUB_REPOSITORY"
              ;;
            *)
              echo "Unrecognized protected-diff classification: $MODE" >&2
              exit 1
              ;;
          esac

      - name: Publish App-bound required current-main status
        if: always() && steps.validator-token.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.validator-token.outputs.token }}
          HEAD_SHA: ${{ steps.subject.outputs.sha }}
          INSPECTION: ${{ steps.inspection.outcome }}
          MODE: ${{ steps.inspection.outputs.mode }}
          PR_NUMBER: ${{ steps.subject.outputs.number }}
          RESULT: ${{ steps.validation.outcome }}
          APP_CONFIG: ${{ steps.app-config.outcome }}
          BASE_SHA: ${{ steps.inspection.outputs.base_sha }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          current_head="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
            --jq .head.sha)"
          test "$current_head" = "$HEAD_SHA" || exit 0
          state=failure
          description='Protected Store diff is not authorized'
          current_base="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" \
            --jq .object.sha)"
          if test "$APP_CONFIG" = success && test "$current_base" = "$BASE_SHA" &&
            test "$INSPECTION" = success && test "$RESULT" = success; then
            state=success
            if test "$MODE" = none; then
              description='No protected Store paths changed'
            else
              description="Trusted-main ${MODE} validation at ${BASE_SHA:0:12}"
            fi
          fi
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state="$state" \
            -f context='Zoo v2 current-main' \
            -f description="$description"
          test "$state" = success

      - name: Explain unavailable validator authority
        if: failure() && (steps.app-settings.outcome != 'success' || steps.app-config.outcome != 'success' || steps.validator-token.outcome == 'failure')
        run: |
          echo "::error::validator App unavailable: configuration, committed protection audit, or token minting failed. No successful required status is claimed."
          printf '%s\n' 'Validator authority is unavailable. See the failed preflight above and docs/CI.md; this is not a publisher-code verdict.' >> "$GITHUB_STEP_SUMMARY"
          exit 1
