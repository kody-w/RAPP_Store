name: Zoo v2 bootstrap permanent-ref migration

on:
  workflow_dispatch:

permissions: {}

jobs:
  protect:
    permissions:
      contents: write
    environment: zoo-v2-validator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Configure migration identity
        run: |
          git config user.name "rapp-store-bot"
          git config user.email "rapp-store-bot@users.noreply.github.com"

      - name: Require committed admin protection audit
        env:
          VALIDATOR_APP_ID: ${{ secrets.ZOO_V2_VALIDATOR_APP_ID }}
          VALIDATOR_APP_LOGIN: ${{ secrets.ZOO_V2_VALIDATOR_APP_LOGIN }}
          VALIDATOR_APP_SLUG: ${{ secrets.ZOO_V2_VALIDATOR_APP_SLUG }}
          VALIDATOR_APP_USER_ID: ${{ secrets.ZOO_V2_VALIDATOR_APP_USER_ID }}
        run: |
          set -euo pipefail
          test -n "$VALIDATOR_APP_ID"
          test -n "$VALIDATOR_APP_SLUG"
          test -n "$VALIDATOR_APP_LOGIN"
          test -n "$VALIDATOR_APP_USER_ID"
          python3 scripts/configure_zoo_v2_protection.py verify-audit \
            --repository "$GITHUB_REPOSITORY" \
            --validator-app-id "$VALIDATOR_APP_ID" \
            --validator-app-slug "$VALIDATOR_APP_SLUG" \
            --validator-app-login "$VALIDATOR_APP_LOGIN" \
            --validator-app-user-id "$VALIDATOR_APP_USER_ID"

      - name: Create or verify the bootstrap permanent ref
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)"
          export GIT_CONFIG_VALUE_0
          python3 scripts/zoo_v2_release.py protect-bootstrap \
            --repository "$GITHUB_REPOSITORY"

      - name: Audit all generations
        run: |
          python3 scripts/zoo_v2_release.py audit-refs \
            --repository "$GITHUB_REPOSITORY" \
            --network
