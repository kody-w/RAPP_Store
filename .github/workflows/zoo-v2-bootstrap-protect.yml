name: Zoo v2 bootstrap permanent-ref migration

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  protect:
    environment: zoo-v2-validator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure migration identity
        run: |
          git config user.name "rapp-store-bot"
          git config user.email "rapp-store-bot@users.noreply.github.com"

      - name: Require committed admin protection audit
        env:
          VALIDATOR_APP_ID: ${{ secrets.ZOO_V2_VALIDATOR_APP_ID }}
        run: |
          test -n "$VALIDATOR_APP_ID"
          python3 scripts/configure_zoo_v2_protection.py verify-audit \
            --repository "$GITHUB_REPOSITORY" \
            --validator-app-id "$VALIDATOR_APP_ID"

      - name: Create or verify the bootstrap permanent ref
        run: |
          python3 scripts/zoo_v2_release.py protect-bootstrap \
            --repository "$GITHUB_REPOSITORY"

      - name: Audit all generations
        run: |
          python3 scripts/zoo_v2_release.py audit-refs \
            --repository "$GITHUB_REPOSITORY" \
            --network
