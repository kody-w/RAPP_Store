name: Approve rapplication submission

on:
  issues:
    types: [labeled]

permissions: {}

concurrency:
  group: rapp-store-state
  cancel-in-progress: false

jobs:
  approve:
    if: |
      startsWith(github.event.issue.title, '[RAPP]') &&
      github.event.label.name == 'approved'
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Prepare promotion candidate
        id: promote
        run: |
          set -euo pipefail
          mkdir -p .ci-work
          python3 .github/workflows/rapplication_pr.py promotion \
            --event-path "$GITHUB_EVENT_PATH" > .ci-work/promotion-report.md

      - name: Open checked promotion PR
        id: persist
        if: steps.promote.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 .github/workflows/rapplication_pr.py open-promotion --event-path "$GITHUB_EVENT_PATH"

      - name: Report outcome
        if: always()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PROMOTION_OUTCOME: ${{ steps.promote.outcome }}
          PR_OUTCOME: ${{ steps.persist.outcome }}
          PR_URL: ${{ steps.persist.outputs.pr_url }}
        with:
          script: |
            const fs = require('fs');
            const ready = process.env.PROMOTION_OUTCOME === 'success' &&
                          process.env.PR_OUTCOME === 'success' && process.env.PR_URL;
            const path = '.ci-work/promotion-report.md';
            const report = fs.existsSync(path) ? fs.readFileSync(path, 'utf8').trim() : '';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const failure = process.env.PROMOTION_OUTCOME === 'failure' && report
              ? report : 'Validation, candidate publication or exact-ref validation dispatch failed.';
            const body = ready
              ? `## Promotion PR prepared — not published\n\n${report}\n\nReview ${process.env.PR_URL}. Only an owner merge of the exact checked head permits publication reporting and issue closure.`
              : `## Promotion not published\n\n${failure}\n\nThe issue remains open. Inspect ${runUrl} before retrying approval.`;
            await github.rest.issues.createComment({...context.repo, issue_number: context.issue.number, body});
            if (ready) {
              try {
                await github.rest.issues.removeLabel({...context.repo, issue_number: context.issue.number, name: 'failed'});
              } catch (error) { if (error.status !== 404) throw error; }
            } else {
              await github.rest.issues.addLabels({...context.repo, issue_number: context.issue.number, labels: ['failed']});
              try {
                await github.rest.issues.removeLabel({...context.repo, issue_number: context.issue.number, name: 'approved'});
              } catch (error) { if (error.status !== 404) throw error; }
            }
