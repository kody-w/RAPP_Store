name: Zoo v2 persist merged command completion

on:
  pull_request_target:
    types: [closed]

permissions: {}

concurrency:
  group: zoo-v2-complete-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  complete:
    permissions:
      contents: read
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      startsWith(github.event.pull_request.head.ref, 'zoo-v2/issue-') &&
      github.event.pull_request.head.repo.full_name == github.repository
    environment: zoo-v2-validator
    runs-on: ubuntu-latest
    steps:
      - name: Check validator App availability before minting
        env:
          ZOO_V2_VALIDATOR_APP_ID: ${{ secrets.ZOO_V2_VALIDATOR_APP_ID }}
          ZOO_V2_VALIDATOR_PRIVATE_KEY: ${{ secrets.ZOO_V2_VALIDATOR_PRIVATE_KEY }}
          ZOO_V2_VALIDATOR_APP_LOGIN: ${{ secrets.ZOO_V2_VALIDATOR_APP_LOGIN }}
          ZOO_V2_VALIDATOR_APP_SLUG: ${{ secrets.ZOO_V2_VALIDATOR_APP_SLUG }}
          ZOO_V2_VALIDATOR_APP_USER_ID: ${{ secrets.ZOO_V2_VALIDATOR_APP_USER_ID }}
        run: |
          python3 - <<'PY'
          import os
          import sys
          names = ("APP_ID", "PRIVATE_KEY", "APP_LOGIN", "APP_SLUG", "APP_USER_ID")
          missing = ["ZOO_V2_VALIDATOR_" + name for name in names
                     if not os.environ.get("ZOO_V2_VALIDATOR_" + name, "").strip()]
          if missing:
              print("::error::validator App unavailable: missing " + ", ".join(missing))
              sys.exit(1)
          PY

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Require exact committed validator App configuration
        env:
          VALIDATOR_APP_ID: ${{ secrets.ZOO_V2_VALIDATOR_APP_ID }}
          VALIDATOR_APP_LOGIN: ${{ secrets.ZOO_V2_VALIDATOR_APP_LOGIN }}
          VALIDATOR_APP_SLUG: ${{ secrets.ZOO_V2_VALIDATOR_APP_SLUG }}
          VALIDATOR_APP_USER_ID: ${{ secrets.ZOO_V2_VALIDATOR_APP_USER_ID }}
        run: |
          set -euo pipefail
          test -n "$VALIDATOR_APP_ID"
          test -n "$VALIDATOR_APP_SLUG"
          test -n "$VALIDATOR_APP_LOGIN"
          test -n "$VALIDATOR_APP_USER_ID"
          python3 scripts/configure_zoo_v2_protection.py verify-audit \
            --repository "$GITHUB_REPOSITORY" \
            --validator-app-id "$VALIDATOR_APP_ID" \
            --validator-app-slug "$VALIDATOR_APP_SLUG" \
            --validator-app-login "$VALIDATOR_APP_LOGIN" \
            --validator-app-user-id "$VALIDATOR_APP_USER_ID"

      - name: Mint dedicated validator App token
        id: validator-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.ZOO_V2_VALIDATOR_APP_ID }}
          private-key: ${{ secrets.ZOO_V2_VALIDATOR_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read
          permission-issues: write
          permission-pull-requests: read

      - name: Record exact merged attempt and close command
        env:
          GH_TOKEN: ${{ steps.validator-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          git fetch --prune --tags origin main
          python3 scripts/zoo_v2_release.py complete-merge \
            --repository "$GITHUB_REPOSITORY" \
            --pr-number "$PR_NUMBER"
