name: Zoo v2 persist merged command completion

on:
  pull_request_target:
    types: [closed]

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: zoo-v2-complete-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  complete:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      startsWith(github.event.pull_request.head.ref, 'zoo-v2/issue-') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Record exact merged attempt and close command
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git fetch --prune --tags origin main
          python3 scripts/zoo_v2_release.py complete-merge \
            --repository "$GITHUB_REPOSITORY" \
            --pr-number "$PR_NUMBER"
