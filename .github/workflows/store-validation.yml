name: Store validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: store-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Complete store suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-test.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check out isolated exact Grail loader fixture
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: microsoft/aibast-agents-library
          ref: c60521e2cacbcbfa585a118c1275093d7bb15b74
          path: .ci-work/grail
          persist-credentials: false

      - name: Prepare validation workspace
        run: mkdir -p .ci-work/tmp

      - name: Install test dependencies
        env:
          TMPDIR: ${{ github.workspace }}/.ci-work/tmp
        run: python3 -m pip install --requirement requirements-test.txt

      - name: Run complete store validation suite
        env:
          TMPDIR: ${{ github.workspace }}/.ci-work/tmp
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          RAPP_GRAIL_TEST_ROOT: ${{ github.workspace }}/.ci-work/grail/rapp_brainstem
        run: |
          node --version
          node --check store-contract.js
          python3 -m pytest tests -q --basetemp=.ci-work/pytest

      - name: AI surface is fresh (llms.txt, registry.json, sessions)
        run: python3 scripts/build_ai_surface.py --check

      - name: rapp-static-api/1.1 lint never gets worse
        run: |
          git clone -q --depth 1 https://github.com/kody-w/rapp-static-apis.git $RUNNER_TEMP/static-apis
          out=$(python3 $RUNNER_TEMP/static-apis/check.py --lint . kody-w/RAPP_Store || true)
          echo "$out" | tail -20
          n=$(echo "$out" | sed -n 's/.*(\([0-9]*\) errors.*/\1/p'); n=${n:-0}
          max=$(cat .static-api-lint-baseline)
          echo "lint errors: $n (allowed: $max)"
          [ "$n" -le "$max" ]

      - name: Verify catalog and discovery remain unchanged
        run: git diff --exit-code HEAD -- index.json api/
