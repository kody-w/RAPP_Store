name: Process rapplication submission

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: write
  issues: write

concurrency:
  group: rapp-store-state
  cancel-in-progress: false

jobs:
  process:
    if: startsWith(github.event.issue.title, '[RAPP]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate submission
        id: validate
        run: |
          set -euo pipefail
          mkdir -p .ci-work
          python3 scripts/process_rapplication.py \
            --event-path "$GITHUB_EVENT_PATH" \
            --staging-dir staging/ \
            --catalog index.json \
            > .ci-work/process-report.md

      - name: Commit staging changes
        id: persist
        if: steps.validate.outcome == 'success'
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          git config user.name "rapp-store-bot"
          git config user.email "rapp-store-bot@users.noreply.github.com"
          # staging/ is in .gitignore so a local clone doesn't accumulate
          # half-finished submissions. The receiver bot intentionally forces
          # the add — the approve workflow (separate run) needs the staged
          # state committed to read it.
          git add -fA staging/
          if git diff --staged --quiet; then
            echo "Validated pending state is already present in current main."
            exit 0
          fi
          git commit -m "stage: rapplication for issue #${ISSUE_NUMBER} [skip ci]"
          for i in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push attempt $i failed; retrying the same commit without rebasing state"
            sleep 3
          done
          echo "::error::Pending state publication was not confirmed. Resubmit from current main."
          exit 1

      - name: Report outcome
        if: always()
        uses: actions/github-script@v7
        env:
          VALIDATION_OUTCOME: ${{ steps.validate.outcome }}
          PUBLICATION_OUTCOME: ${{ steps.persist.outcome }}
        with:
          script: |
            const fs = require('fs');
            const validated = process.env.VALIDATION_OUTCOME === 'success';
            const published = validated && process.env.PUBLICATION_OUTCOME === 'success';
            const path = '.ci-work/process-report.md';
            const report = fs.existsSync(path) ? fs.readFileSync(path, 'utf8').trim() : '';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = published
              ? report || '## ✅ Submission validated and pending state published'
              : validated
                ? `## ❌ Submission not published\n\nValidation passed, but publication of pending state was not confirmed. Do not approve this attempt. Inspect current main, then resubmit through this issue.\n\nWorkflow: ${runUrl}`
                : report || `## ❌ Submission validation failed\n\nNo success or pending-state publication is claimed.\n\nWorkflow: ${runUrl}`;
            await github.rest.issues.createComment({
              ...context.repo, issue_number: context.issue.number, body
            });
            await github.rest.issues.addLabels({
              ...context.repo, issue_number: context.issue.number,
              labels: published ? ['pending-review', 'rapplication-submission']
                                : ['failed', 'rapplication-submission']
            });
