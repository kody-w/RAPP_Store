name: Process rapplication submission

on:
  issues:
    types: [opened, edited, reopened]

permissions: {}

concurrency:
  group: rapp-store-state
  cancel-in-progress: false

jobs:
  process:
    if: startsWith(github.event.issue.title, '[RAPP]')
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Invalidate outdated issue candidates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 .github/workflows/rapplication_pr.py invalidate --event-path "$GITHUB_EVENT_PATH"

      - name: Validate submission
        id: validate
        run: |
          set -euo pipefail
          mkdir -p .ci-work
          python3 .github/workflows/rapplication_pr.py stage \
            --event-path "$GITHUB_EVENT_PATH" > .ci-work/process-report.md

      - name: Open checked staging PR
        id: persist
        if: steps.validate.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 .github/workflows/rapplication_pr.py open-stage --event-path "$GITHUB_EVENT_PATH"

      - name: Report outcome
        if: always()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          VALIDATION_OUTCOME: ${{ steps.validate.outcome }}
          PR_OUTCOME: ${{ steps.persist.outcome }}
          PR_URL: ${{ steps.persist.outputs.pr_url }}
        with:
          script: |
            const fs = require('fs');
            const ready = process.env.VALIDATION_OUTCOME === 'success' &&
                          process.env.PR_OUTCOME === 'success' && process.env.PR_URL;
            const path = '.ci-work/process-report.md';
            const report = fs.existsSync(path) ? fs.readFileSync(path, 'utf8').trim() : '';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const failure = process.env.VALIDATION_OUTCOME === 'failure' && report
              ? report : 'Validation, candidate publication or exact-ref validation dispatch failed.';
            const body = ready
              ? `## Submission staged for review — not published\n\n${report}\n\nReview ${process.env.PR_URL}. Merge the checked staging PR first; then add \`approved\` to prepare a separate catalog-promotion PR. The issue remains open.`
              : `## Submission not published\n\n${failure}\n\nDo not approve this attempt. Inspect ${runUrl} and reprocess the issue.`;
            await github.rest.issues.createComment({...context.repo, issue_number: context.issue.number, body});
            await github.rest.issues.addLabels({
              ...context.repo, issue_number: context.issue.number,
              labels: ready ? ['pending-review', 'rapplication-submission'] : ['failed', 'rapplication-submission']
            });
