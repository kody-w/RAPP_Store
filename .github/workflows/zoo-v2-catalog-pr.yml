name: Zoo v2 catalog issue to PR

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: zoo-v2-catalog-integration-queue
  cancel-in-progress: false

jobs:
  catalog-pr:
    if: |
      github.event.label.name == 'zoo-v2-eligible' &&
      startsWith(github.event.issue.title, '[ZOO V2 ')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure release identity
        run: |
          git config user.name "rapp-store-bot"
          git config user.email "rapp-store-bot@users.noreply.github.com"

      - name: Ensure bootstrap has a permanent ref
        run: |
          python3 scripts/zoo_v2_release.py protect-bootstrap \
            --repository "$GITHUB_REPOSITORY"

      - name: Build exact issue-derived generation from current main
        id: generation
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ALLOWED_ACTORS: ${{ github.repository_owner }},${{ vars.RAPP_ZOO_V2_ACTORS }}
        run: |
          set -euo pipefail
          git fetch --prune origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          path="$(python3 scripts/zoo_v2_store.py apply-issue \
            --event-path "$GITHUB_EVENT_PATH" \
            --discovery api/v2/discovery.json \
            --output-dir api/v2/generations \
            --allow-actors "$ALLOWED_ACTORS")"
          test "$path" = "api/v2/generations/issue-${ISSUE_NUMBER}.json"
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Test catalog and security boundaries
        run: |
          python3 -m pytest tests -q
          python3 scripts/zoo_v2_store.py validate-tree --root .

      - name: Resume serialized generation release and PR
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GENERATION_PATH: ${{ steps.generation.outputs.path }}
        run: |
          set -euo pipefail
          python3 scripts/zoo_v2_release.py resume \
            --generation "$GENERATION_PATH" \
            --repository "$GITHUB_REPOSITORY" \
            --issue-number "$ISSUE_NUMBER"
